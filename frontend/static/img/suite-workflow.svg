<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Integrated O-GlcNAc research workflow</title>
  <desc id="desc">Experimental evidence, protein sequences, and mass-spectrometry intensities connect to the four oglcnac.org resources and support biological hypotheses.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6.5" refY="3.25" orient="auto">
      <path d="M0 0 7 3.25 0 6.5Z" fill="#6d8091"/>
    </marker>
  </defs>
  <rect width="960" height="500" rx="28" fill="#f5f8fb"/>
  <g font-family="Arial, sans-serif">
    <text x="48" y="56" fill="#607286" font-size="17" font-weight="700" letter-spacing="1.8">RESEARCH INPUTS</text>
    <text x="402" y="56" fill="#607286" font-size="17" font-weight="700" letter-spacing="1.8">RESOURCE</text>
    <text x="784" y="56" fill="#607286" font-size="17" font-weight="700" letter-spacing="1.8">OUTCOME</text>
    <g fill="#fff" stroke="#c9d6e1" stroke-width="2">
      <rect x="48" y="84" width="282" height="92" rx="15"/>
      <rect x="48" y="204" width="282" height="92" rx="15"/>
      <rect x="48" y="324" width="282" height="92" rx="15"/>
    </g>
    <g fill="#132b40" font-size="20" font-weight="700">
      <text x="74" y="122">Experimental evidence</text>
      <text x="74" y="242">Protein sequence</text>
      <text x="74" y="362">MS/MS intensities</text>
    </g>
    <g fill="#607286" font-size="14.5">
      <text x="74" y="148">Sites and OGT interactions</text>
      <text x="74" y="268">Human or mouse FASTA</text>
      <text x="74" y="388">Five diagnostic oxonium ions</text>
    </g>
    <g fill="none" stroke="#91a5b5" stroke-linecap="round" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M330 130h42v-10h20"/>
      <path d="M330 130h42v94h20"/>
      <path data-flow="protein-to-pred-dl" d="M330 250h62"/>
      <path d="M330 370h42v94h20"/>
    </g>
    <g fill="#fff" stroke-width="2.5">
      <rect x="402" y="84" width="286" height="72" rx="14" stroke="#3478bd"/>
      <rect x="402" y="188" width="286" height="72" rx="14" stroke="#168a80"/>
      <rect x="402" y="292" width="286" height="72" rx="14" stroke="#4f70c2"/>
      <rect x="402" y="396" width="286" height="72" rx="14" stroke="#7655a6"/>
    </g>
    <g fill="#132b40" font-size="20" font-weight="700">
      <text x="428" y="128">O-GlcNAcAtlas</text>
      <text x="428" y="232">OGT-PIN</text>
      <text x="428" y="336">O-GlcNAcPRED-DL</text>
      <text x="428" y="440">HexNAcQuest</text>
    </g>
    <g fill="none" stroke="#91a5b5" stroke-linecap="round" stroke-width="2.5">
      <path d="M688 120h44"/>
      <path d="M688 224h44"/>
      <path d="M688 328h44"/>
      <path d="M688 432h44"/>
      <path d="M732 120v312"/>
      <path d="M732 276h24" marker-end="url(#arrow)"/>
    </g>
    <rect x="756" y="206" width="164" height="140" rx="20" fill="#102b46"/>
    <circle cx="838" cy="250" r="22" fill="#fff" opacity=".13"/>
    <path d="m826 250 8 8 17-20" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="5.5"/>
    <text x="838" y="296" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Evidence-informed</text>
    <text x="838" y="318" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">hypothesis</text>
  </g>
</svg>
