<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">OGT-PIN conceptual overview</title>
  <desc id="desc">Published experimental reports are curated into a searchable network of proteins that interact with OGT and its orthologues.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 8 3 0 6Z" fill="#628177"/>
    </marker>
  </defs>
  <rect width="1080" height="620" rx="32" fill="#f1f8f6"/>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="138" width="245" height="340" rx="24" fill="#fff" stroke="#b7d8d2" stroke-width="3"/>
    <text x="182" y="188" fill="#0f635c" font-size="21" font-weight="700" text-anchor="middle">Experimental reports</text>
    <g fill="#e4f3f0" stroke="#5ca99f" stroke-width="2">
      <rect x="100" y="225" width="165" height="54" rx="10"/>
      <rect x="100" y="298" width="165" height="54" rx="10"/>
      <rect x="100" y="371" width="165" height="54" rx="10"/>
    </g>
    <g fill="#21463f" font-size="17" text-anchor="middle">
      <text x="182" y="258">Interaction evidence</text>
      <text x="182" y="331">Species and identifiers</text>
      <text x="182" y="404">Method and PMID</text>
    </g>
    <path d="M305 308h105" fill="none" stroke="#628177" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="425" y="84" width="250" height="448" rx="28" fill="#0f766e"/>
    <text x="550" y="136" fill="#cdece7" font-size="18" font-weight="700" letter-spacing="2" text-anchor="middle">CURATION</text>
    <circle cx="550" cy="250" r="70" fill="#fff"/>
    <text x="550" y="264" fill="#0f766e" font-size="35" font-weight="700" text-anchor="middle">OGT</text>
    <g fill="none" stroke="#b5e1da" stroke-width="4">
      <path d="m550 320-63 78m63-78 64 78m-64-78v97"/>
    </g>
    <g fill="#fff">
      <circle cx="487" cy="408" r="24"/><circle cx="614" cy="408" r="24"/><circle cx="550" cy="427" r="24"/>
    </g>
    <text x="550" y="488" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">OGT and orthologues</text>
    <path d="M675 308h105" fill="none" stroke="#628177" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="795" y="138" width="225" height="340" rx="24" fill="#fff" stroke="#b7d8d2" stroke-width="3"/>
    <text x="907" y="188" fill="#0f635c" font-size="21" font-weight="700" text-anchor="middle">Curated OGT-PIN</text>
    <g fill="#e4f3f0">
      <circle cx="907" cy="277" r="40"/>
      <circle cx="851" cy="355" r="25"/>
      <circle cx="963" cy="355" r="25"/>
      <circle cx="907" cy="407" r="25"/>
    </g>
    <g fill="none" stroke="#168a80" stroke-width="4">
      <path d="m907 317-56 38m56-38 56 38m-56-38v65"/>
    </g>
    <text x="907" y="453" fill="#21463f" font-size="17" text-anchor="middle">Searchable interaction</text>
    <text x="907" y="475" fill="#21463f" font-size="17" text-anchor="middle">records and evidence</text>
  </g>
</svg>
