name: Static site quality

on:
  push:
    paths:
      - ".github/workflows/**"
      - "site/**"
      - "public/**"
      - "data/atlas-enrichment/**"
      - "prediction-reference/**"
      - "prediction-v2/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "LICENSE"
      - "CONTENT-LICENSE.md"
      - "THIRD-PARTY-NOTICES.md"
      - "NOTICE"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "site/**"
      - "public/**"
      - "data/atlas-enrichment/**"
      - "prediction-reference/**"
      - "prediction-v2/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "LICENSE"
      - "CONTENT-LICENSE.md"
      - "THIRD-PARTY-NOTICES.md"
      - "NOTICE"
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run qa:pr
      - run: npm run qa:public

  browser:
    runs-on: ubuntu-24.04
    # Keep this image aligned with the locked Playwright version. It includes
    # browsers and OS libraries, avoiding slow/unsupported apt installations.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      # Match the owner of GitHub's mounted home/workspace for Firefox.
      options: --init --ipc=host --user 1001
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run test:smoke:browser
        env:
          SMOKE_BROWSER: ${{ matrix.browser }}
      - run: npm run test:tables:browser
        env:
          SITE_BROWSER: ${{ matrix.browser }}
      - run: npm run test:workbench:browser
        env:
          WORKBENCH_BROWSER: ${{ matrix.browser }}
      - run: npm run test:prediction:browser
        env:
          PREDICTION_BROWSER: ${{ matrix.browser }}
      - run: npm run test:hexnac:browser
        env:
          HEXNAC_BROWSER: ${{ matrix.browser }}
      - run: npm run test:accessibility:browser
        env:
          ACCESSIBILITY_BROWSER: ${{ matrix.browser }}

  production-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Keep this image aligned with the locked Playwright version. It includes
    # browsers and OS libraries, avoiding slow/unsupported apt installations.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      # Match the owner of GitHub's mounted home/workspace for Firefox.
      options: --init --ipc=host --user 1001
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run smoke:static:browser
        env:
          SMOKE_BROWSER: ${{ matrix.browser }}
