name: HexNAcQuest browser smoke

on:
  push:
    paths:
      - ".github/workflows/**"
      - "site/pages/hexnac-quest/**"
      - "site/styles/**"
      - "public/static/hexnac-quest/**"
      - "public/static/js/hexnac-quest-*.js"
      - "scripts/tests/hexnac-quest-*.test.js"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "site/pages/hexnac-quest/**"
      - "site/styles/**"
      - "public/static/hexnac-quest/**"
      - "public/static/js/hexnac-quest-*.js"
      - "scripts/tests/hexnac-quest-*.test.js"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "40 9 * * *"
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-24.04
    # Keep this image aligned with the locked Playwright version. It includes
    # browsers and OS libraries, avoiding slow/unsupported apt installations.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      # Match the owner of GitHub's mounted home/workspace for Firefox.
      options: --init --ipc=host --user 1001
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run test:hexnac
        env:
          HEXNAC_BROWSER: ${{ matrix.browser }}
