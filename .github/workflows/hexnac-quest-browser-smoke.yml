name: HexNAcQuest browser smoke

on:
  push:
    paths:
      - "site/pages/hexnac-quest/**"
      - "site/styles/**"
      - "public/static/hexnac-quest/**"
      - "public/static/js/hexnac-quest-*.js"
      - "scripts/tests/hexnac-quest-*.test.js"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "site/pages/hexnac-quest/**"
      - "site/styles/**"
      - "public/static/hexnac-quest/**"
      - "public/static/js/hexnac-quest-*.js"
      - "scripts/tests/hexnac-quest-*.test.js"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "40 9 * * *"
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:hexnac
        env:
          HEXNAC_BROWSER: ${{ matrix.browser }}
