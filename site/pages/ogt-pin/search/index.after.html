  <script src="/static/js/static-data.js"></script>
  <script src="/static/js/table-utils.js"></script>
  <script>
    const interactomeSearchTable = window.OglcnacTables.create("search_result", {
      filename: "ogt-pin-search.csv"
    });

    function interactomeIdentifierCell(record) {
      const uuid = record.uuid_b || "";
      return {
        text: uuid,
        render(cell) {
          if (!uuid) {
            return;
          }
          const uniprot = document.createElement("a");
          uniprot.href = `https://www.uniprot.org/uniprot/${encodeURIComponent(uuid)}`;
          uniprot.rel = "noopener";
          uniprot.textContent = "UniProt ";
          cell.appendChild(uniprot);
          const detail = document.createElement("a");
          detail.href = `/ogt-pin/detail/?id=${encodeURIComponent(uuid)}`;
          const strong = document.createElement("strong");
          strong.textContent = uuid;
          detail.appendChild(strong);
          cell.appendChild(detail);
        }
      };
    }

    function interactomeSearchRow(record) {
      return [
        record.uuid_a,
        record.gene_name_a,
        record.ncbi_id_b,
        interactomeIdentifierCell(record),
        record.gene_name_b,
        record.protein_name_b
      ];
    }

    async function runInteractomeSearch(event) {
      if (event) {
        event.preventDefault();
      }
      const form = document.getElementById("interactome-search-form");
      const term = form.q.value.trim();
      const field = form.field.value;
      if (!term) {
        interactomeSearchTable.setRows([]);
        return;
      }
      interactomeSearchTable.setLoading("Loading OGT-PIN records…");
      try {
        const results = await window.OglcnacStaticData.searchOgtPin(term, field);
        interactomeSearchTable.setRows(results.map(interactomeSearchRow), {
          preserveState: false
        });
        window.history.replaceState(
          {},
          "",
          `${window.location.pathname}?q=${encodeURIComponent(term)}&field=${encodeURIComponent(field)}`
        );
      } catch (error) {
        interactomeSearchTable.setError(
          "OGT-PIN records could not be loaded. Please try again."
        );
      }
    }

    const interactomeSearchForm = document.getElementById(
      "interactome-search-form"
    );
    interactomeSearchForm.addEventListener("submit", runInteractomeSearch);
    const interactomeSearchParams = new URLSearchParams(window.location.search);
    if (interactomeSearchParams.get("q")) {
      interactomeSearchForm.q.value = interactomeSearchParams.get("q");
      if (interactomeSearchParams.get("field")) {
        interactomeSearchForm.field.value = interactomeSearchParams.get("field");
      }
      runInteractomeSearch();
    }
  </script>
