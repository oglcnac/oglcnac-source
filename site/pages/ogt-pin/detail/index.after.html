    <script src="/static/js/static-data.js"></script>
    <script src="/static/js/table-utils.js"></script>
    <script>
        const detailParams = new URLSearchParams(window.location.search);
        const INTERACTOME_UUID_B = detailParams.get("id") || decodeURIComponent(window.location.pathname.split("/").filter(Boolean).pop() || "Q9H1M0");
        document.getElementById("interactome-title").textContent = INTERACTOME_UUID_B;

        const interactomeDetailTable = window.OglcnacTables.create(
            "interactome",
            { filename: `${INTERACTOME_UUID_B}-ogt-pin.csv` }
        );
        const interactomeRecordState = document.createElement("p");
        interactomeRecordState.setAttribute("data-record-state", "ogt-pin");
        interactomeRecordState.setAttribute("role", "status");
        document.querySelector(".interactome-detail-page .detail-hero").appendChild(
            interactomeRecordState
        );

        function interactomeDetailRow(record) {
            return [
                record.uuid_b,
                record.alt_id_b,
                record.detection_method,
                {
                    text: record.pmid,
                    href: record.pmid
                        ? `https://www.ncbi.nlm.nih.gov/pubmed/?term=${encodeURIComponent(record.pmid)}`
                        : "",
                    external: true
                },
                record.analytic_throughput,
                record.source,
                record.curater_comments,
                record.meeting_imex_criteria,
                record.high_stringency_interactor
            ];
        }

        async function loadInteractomeDetail() {
            interactomeRecordState.dataset.state = "loading";
            interactomeRecordState.textContent = "Loading interaction record…";
            interactomeDetailTable.setLoading("Loading interaction evidence…");
            try {
                const payload = await window.OglcnacStaticData.getOgtPinDetail(
                    INTERACTOME_UUID_B
                );
                if (!payload.records.length) {
                    interactomeRecordState.dataset.state = "empty";
                    interactomeRecordState.textContent =
                        `No OGT-PIN record was found for ${INTERACTOME_UUID_B}.`;
                    interactomeDetailTable.setRows([]);
                    return;
                }
                interactomeDetailTable.setRows(
                    payload.records.map(interactomeDetailRow)
                );
                interactomeRecordState.dataset.state = "ready";
                interactomeRecordState.textContent =
                    `${payload.records.length.toLocaleString()} interaction evidence records loaded.`;
            } catch (error) {
                interactomeRecordState.dataset.state = "error";
                interactomeRecordState.textContent =
                    "This OGT-PIN record could not be loaded. Please try again.";
                interactomeDetailTable.setError(
                    "Interaction evidence could not be loaded."
                );
            }
        }

        loadInteractomeDetail();
    </script>
