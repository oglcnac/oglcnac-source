    <script src="/static/js/static-data.js"></script>
    <script src="/static/js/table-utils.js"></script>
    <script src="/static/js/record-view.js"></script>
    <script>
        const detailParams = new URLSearchParams(window.location.search);
        const detailPath = decodeURIComponent(window.location.pathname.split("/").filter(Boolean).pop() || "");
        const INTERACTOME_UUID_B = (detailParams.get("id") || (!["detail", "index.html"].includes(detailPath) ? detailPath : "")).trim();
        document.getElementById("interactome-title").textContent = INTERACTOME_UUID_B || "Find an interaction record";

        const recordView = window.OglcnacRecordView;
        let completeRecords = [];
        document.querySelector('.record-section-nav details').open = matchMedia('(min-width: 901px)').matches;
        document.getElementById('ogt-download-record').addEventListener('click', () => {
            const fields = recordView.exportFields(completeRecords);
            const csv = window.OglcnacTables.rowsToText(fields, completeRecords.map(record => fields.map(field => record[field])), ',');
            const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
            const link = document.createElement('a'); link.href = url; link.download = `${INTERACTOME_UUID_B}-ogt-pin-complete.csv`;
            document.body.append(link); link.click(); link.remove(); URL.revokeObjectURL(url);
        });
        function fillIdentity(records) {
            completeRecords = records;
            const join = field => recordView.values(records, field).join(' / ') || 'Not reported';
            document.getElementById('ogt-protein-name').textContent = join('protein_name_b');
            document.getElementById('ogt-gene-name').textContent = join('gene_name_b');
            document.getElementById('ogt-species').textContent = join('ncbi_id_b');
            document.getElementById('ogt-partner').textContent = `${join('gene_name_a')} · ${join('uuid_a')}`;
            document.getElementById('ogt-uniprot-link').href = `https://www.uniprot.org/uniprotkb/${encodeURIComponent(INTERACTOME_UUID_B)}/entry`;
            document.getElementById('ogt-uniprot-link').hidden = !/^[A-Z0-9]{6,10}(?:-\d+)?$/.test(INTERACTOME_UUID_B);
            const publications = recordView.publications(records);
            document.getElementById('ogt-publication-summary').textContent = `${publications.length} distinct source ${publications.length === 1 ? 'publication' : 'publications'} linked from these records.`;
            const list = document.getElementById('ogt-publication-list'); list.replaceChildren();
            publications.forEach(pmid => { const item = document.createElement('li'), a = document.createElement('a'); a.href = `https://pubmed.ncbi.nlm.nih.gov/${pmid}/`; a.textContent = `PMID ${pmid}`; item.append(a); list.append(item); });
        }
        function showOgtContent(visible) {
            document.querySelectorAll('.interactome-detail-page .detail-section').forEach(section => { section.hidden = !visible; });
            document.querySelectorAll('.record-section-nav a[href^="#"]').forEach(link => { link.hidden = !visible && link.hash !== '#ogt-overview'; });
            document.getElementById('ogt-identity').hidden = !visible;
            document.getElementById('ogt-record-actions').hidden = !visible;
        }
        const interactomeDetailTable = window.OglcnacTables.create(
            "interactome",
            { mobileColumns: [0, 2, 3, 8], filename: `${INTERACTOME_UUID_B}-ogt-pin.csv` }
        );
  const interactomeRecordState = document.createElement("p");
  interactomeRecordState.setAttribute("data-record-state", "ogt-pin");
  interactomeRecordState.setAttribute("role", "status");
  interactomeRecordState.setAttribute("aria-live", "polite");
        document.querySelector(".interactome-detail-page .record-subtitle").after(interactomeRecordState);

        const recovery = document.createElement("div");
        recovery.className = "record-recovery";
        const example = document.createElement("a");
        example.href = "/ogt-pin/detail/?id=Q9H1M0";
        example.textContent = "Explore example Q9H1M0";
        const retry = document.createElement("button");
        retry.type = "button";
        retry.textContent = "Retry loading record";
        retry.hidden = true;
        retry.addEventListener("click", loadInteractomeDetail);
        recovery.append(example, retry);
        interactomeRecordState.after(recovery);
        function interactomeDetailRow(record) {
            return [
                record.uuid_b,
                record.alt_id_b,
                record.detection_method,
                {
                    text: record.pmid,
                    href: record.pmid
                        ? `https://www.ncbi.nlm.nih.gov/pubmed/?term=${encodeURIComponent(record.pmid)}`
                        : "",
                    external: true
                },
                record.analytic_throughput,
                record.source,
                record.curater_comments,
                record.meeting_imex_criteria,
                record.high_stringency_interactor
            ];
        }

        async function loadInteractomeDetail() {
            showOgtContent(false);
            retry.hidden = true;
            if (!INTERACTOME_UUID_B) {
                interactomeRecordState.dataset.state = "initial";
                interactomeRecordState.textContent = "Search for an interactor above, or open an example to explore the curated interaction evidence.";
                return;
            }
            interactomeRecordState.dataset.state = "loading";
            interactomeRecordState.textContent = "Loading interaction record…";
            interactomeDetailTable.setLoading("Loading interaction evidence…");
            try {
                const payload = await window.OglcnacStaticData.getOgtPinDetail(
                    INTERACTOME_UUID_B
                );
                if (!payload.records.length) {
                    interactomeRecordState.dataset.state = "empty";
                    interactomeRecordState.textContent =
                        `No OGT-PIN record was found for ${INTERACTOME_UUID_B}.`;
                    interactomeDetailTable.setRows([]);
                    return;
                }
                showOgtContent(true);
                fillIdentity(payload.records);
                recovery.hidden = true;
                interactomeDetailTable.setRows(
                    payload.records.map(interactomeDetailRow)
                );
                interactomeRecordState.dataset.state = "ready";
                interactomeRecordState.textContent =
                    `${payload.records.length.toLocaleString()} interaction evidence records loaded.`;
            } catch (error) {
                retry.hidden = false;
                interactomeRecordState.dataset.state = "error";
                interactomeRecordState.textContent =
                    "This OGT-PIN record could not be loaded. Please try again.";
                interactomeDetailTable.setError(
                    "Interaction evidence could not be loaded."
                );
            }
        }

        loadInteractomeDetail();
    </script>
