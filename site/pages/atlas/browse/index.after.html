<script src="/static/js/static-data.js"></script>
<script src="/static/js/table-utils.js"></script>
<script>
const atlasBrowseTable = window.OglcnacTables.create("search_result", {
  filename: "oglcnac-atlas-browse.csv"
});

function atlasBrowseRow(record) {
  const accession = record.accession || "";
  return [
    accession
      ? {
          text: accession,
          href: `/atlas/detail/?id=${encodeURIComponent(accession)}`,
          strong: true
        }
      : "Not available",
    record.entry_name || "Not available",
    record.protein_name || "Not available",
    record.gene_name || "Not available",
    record.position_in_protein || "Not available",
    accession
      ? {
          text: "UniProt",
          href: `https://www.uniprot.org/uniprot/${encodeURIComponent(accession)}`,
          external: true
        }
      : "Not available"
  ];
}

async function loadBrowse(species) {
  const selectedSpecies = species || "Human";
  atlasBrowseTable.context = selectedSpecies;
  document.querySelectorAll(".species-filter [data-species]").forEach((button) => {
    const selected = button.dataset.species === selectedSpecies;
    button.classList.toggle("active", selected);
    button.setAttribute("aria-pressed", String(selected));
  });
  window.history.replaceState(
    {},
    "",
    `${window.location.pathname}?species=${encodeURIComponent(selectedSpecies)}`
  );
  atlasBrowseTable.setLoading(`Loading ${selectedSpecies} Atlas records…`);
  try {
    const results = await window.OglcnacStaticData.browseAtlas(
      selectedSpecies,
      ""
    );
    atlasBrowseTable.setRows(results.map(atlasBrowseRow), {
      context: selectedSpecies,
      preserveState: false
    });
  } catch (error) {
    atlasBrowseTable.context = selectedSpecies;
    atlasBrowseTable.setError(
      "Atlas browse records could not be loaded. Please try again."
    );
  }
}

document.querySelectorAll(".species-filter [data-species]").forEach((button) => {
  button.addEventListener("click", () => loadBrowse(button.dataset.species));
});
const atlasBrowseParams = new URLSearchParams(window.location.search);
loadBrowse(atlasBrowseParams.get("species") || "Human");
</script>
