<section class="page-hero page-hero-compact">
  <div class="container page-hero-inner">
    <p class="eyebrow">O-GlcNAcAtlas 5.0</p>
    <h1>Browse Atlas by species</h1>
    <p class="page-lead">
      Select a species to explore its curated O-GlcNAc protein and site
      records.
    </p>
    <div class="species-filter" aria-label="Browse by species">
      <button type="button" data-species="Human">Human</button>
      <button type="button" data-species="mouse">Mouse</button>
      <button type="button" data-species="Rat">Rat</button>
      <button type="button" data-species="Drosophila">Drosophila</button>
      <button type="button" data-species="Arabidopsis">Arabidopsis</button>
      <button type="button" data-species="C. Elegans">C. elegans</button>
      <button type="button" data-species="Others">Other species</button>
    </div>
  </div>
</section>

<section class="table-results-section" aria-labelledby="atlas-browse-results-heading">
  <div class="container">
    <div class="table-card-header">
      <span>Species records</span>
      <h2 id="atlas-browse-results-heading">Browse results</h2>
    </div>
    <div class="table-scroll" tabindex="0" role="region" aria-label="O-GlcNAcAtlas species browse results table">
      <table class="table results-table" id="search_result">
        <thead>
          <tr>
            <th>Accession</th>
            <th>Entry Name</th>
            <th>Protein Name</th>
            <th>Gene Name</th>
            <th>Position in Protein</th>
            <th>UniProt Link</th>
          </tr>
        </thead>
        <tbody id="atlas-browse-results"></tbody>
      </table>
    </div>
  </div>
</section>
