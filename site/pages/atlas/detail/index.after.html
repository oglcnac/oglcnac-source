<script>
  function peptideDescriptor(record) {
    const peptide = record.peptide_seq || "";
    return {
      text: peptide,
      render(cell) {
        const position = Number(record.position_in_peptide);
        if (!peptide || !Number.isInteger(position) || position < 1 || position > peptide.length) {
          cell.textContent = peptide;
          return;
        }
        cell.appendChild(document.createTextNode(peptide.slice(0, position - 1)));
        const mark = document.createElement("mark");
        const strong = document.createElement("strong");
        strong.textContent = peptide[position - 1];
        mark.appendChild(strong);
        cell.appendChild(mark);
        cell.appendChild(document.createTextNode(peptide.slice(position)));
      }
    };
  }

  function pmidDescriptor(pmid) {
    return {
      text: pmid,
      href: pmid
        ? `https://www.ncbi.nlm.nih.gov/pubmed/?term=${encodeURIComponent(pmid)}`
        : "",
      external: true
    };
  }

  function atlasPeptideRow(record) {
    return [
      record.id,
      peptideDescriptor(record),
      record.site_residue,
      record.position_in_peptide,
      record.position_in_protein
    ];
  }

  function atlasEvidenceRow(record) {
    return [
      record.id,
      record.method,
      record.analytical_throughput,
      record.ambiguous,
      record.species,
      record.sample_type,
      record.condition,
      record.log2FC,
      record.p_value,
      pmidDescriptor(record.pmid),
      record.comments
    ];
  }

  const atlasPeptideTable = window.OglcnacTables.create("detail1", {
    mobileColumns: [4, 1, 2],
    filename: `${ATLAS_ACCESSION}-peptides.csv`
  });
  const atlasEvidenceTable = window.OglcnacTables.create("detail2", {
    mobileColumns: [1, 4, 9, 3],
    filename: `${ATLAS_ACCESSION}-evidence.csv`
  });
  let atlasExportTable;
  let atlasCompleteRecords = [];
  let atlasCompleteFields = [];
  let atlasProteinViewer;
  let atlasFasta = '';
  let atlasEvidenceController, atlasFeatureViewer, atlasLoadGeneration = 0;
  let atlasAppliedRows, atlasAppliedBase;
  const sameAtlasRows = (a, b) => a && a.length === b.length && a.every((row, index) => row === b[index]);
  const atlasView = window.OglcnacRecordView;
  document.querySelector('.record-section-nav details').open = matchMedia('(min-width: 901px)').matches;
  document.getElementById('atlas-download-record').addEventListener('click', () => {
    const csv = window.OglcnacTables.rowsToText(atlasCompleteFields, atlasCompleteRecords.map(record => atlasCompleteFields.map(field => record[field])), ',');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const link = document.createElement('a'); link.href = url; link.download = `${ATLAS_ACCESSION}-complete-record.csv`;
    document.body.append(link); link.click(); link.remove(); URL.revokeObjectURL(url);
  });
  document.getElementById('atlas-copy-accession').addEventListener('click', async () => {
    const copied = await window.OglcnacProteinViewer.copyText(ATLAS_ACCESSION);
    document.getElementById('atlas-copy-status').textContent = copied ? `Accession ${ATLAS_ACCESSION} copied.` : `Copy this accession: ${ATLAS_ACCESSION}`;
  });
  document.getElementById('atlas-download-fasta').addEventListener('click', () => atlasProteinViewer?.downloadFasta());
  document.getElementById('atlas-copy-fasta').addEventListener('click', async () => {
    const copied = await window.OglcnacProteinViewer.copyText(atlasFasta.trim() + '\n');
    document.getElementById('atlas-sequence-action-status').textContent = copied ? 'Complete FASTA copied.' : 'Use Download FASTA to save the sequence.';
  });
  function downloadAtlasMatching(records) {
    const csv = window.OglcnacTables.rowsToText(atlasCompleteFields, records.map(record => atlasCompleteFields.map(field => record[field])), ',');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const link = document.createElement('a'); link.href = url; link.download = `${ATLAS_ACCESSION}-matching-records.csv`;
    document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function applyAtlasEvidence(selection) {
    if (!sameAtlasRows(atlasAppliedRows, selection.records)) {
      atlasPeptideTable.setRows(selection.records.map(atlasPeptideRow));
      atlasEvidenceTable.setRows(selection.records.map(atlasEvidenceRow));
      atlasAppliedRows = selection.records;
    }
    const suffix = `${selection.position ? `-position-${selection.position}` : ''}${selection.active ? '-filtered' : ''}`;
    atlasPeptideTable.options.filename = `${ATLAS_ACCESSION}${suffix}-peptides.csv`;
    atlasEvidenceTable.options.filename = `${ATLAS_ACCESSION}${suffix}-evidence.csv`;
    if (!sameAtlasRows(atlasAppliedBase, selection.baseRecords)) {
      atlasProteinViewer?.setEvidence(selection.baseRecords);
      atlasAppliedBase = selection.baseRecords;
    }
    document.querySelectorAll('[data-atlas-selection-note]').forEach(note => {
      note.hidden = !selection.position && !selection.active; note.replaceChildren();
      if (note.hidden) return;
      note.append(document.createTextNode(`${selection.records.length} of ${atlasCompleteRecords.length} source records${selection.position ? ' · Position ' + selection.position : ''}${selection.active ? ' · Evidence filters applied' : ''}.`));
      if (selection.position) {
        const clear = document.createElement('button'); clear.type = 'button'; clear.textContent = 'Show all positions';
        clear.addEventListener('click', () => atlasProteinViewer.select(null)); note.append(clear);
      }
    });
  }
  function applyAtlasSelection(selection) {
    atlasEvidenceController?.setSelection(selection);
    atlasFeatureViewer?.setSelection(selection);
    document.querySelectorAll('#protein-sequence [data-sequence-position]').forEach(span => {
      if (Number(span.dataset.sequencePosition) === selection.position) span.dataset.selected = 'true';
      else delete span.dataset.selected;
    });
  }
  function populateAtlasIdentity(payload) {
    const join = field => atlasView.values(payload.records, field).join(' / ') || 'Not reported';
    document.getElementById('atlas-entry-name').textContent = join('entry_name');
    const names = atlasView.values(payload.records, 'protein_name');
    const nameField = document.getElementById('atlas-protein-name'); nameField.textContent = names[0] || ATLAS_ACCESSION;
    document.title = `${names[0] || ATLAS_ACCESSION} · ${ATLAS_ACCESSION} | O-GlcNAcAtlas`;
    const aliases = document.getElementById('atlas-other-names'); aliases.replaceChildren(); aliases.hidden = names.length < 2;
    if (names.length > 1) {
      const details = document.createElement('details'); details.className = 'record-aliases';
      const summary = document.createElement('summary'); summary.textContent = `Other reported names (${names.length - 1})`;
      const list = document.createElement('ul');
      for (const name of names.slice(1)) { const item = document.createElement('li'); item.textContent = name; list.append(item); }
      details.append(summary, list); aliases.append(details);
    }
    document.getElementById('atlas-gene-name').textContent = join('gene_name');
    document.getElementById('atlas-species').textContent = join('species');
    const link = document.getElementById('atlas-uniprot-link');
    link.href = `https://www.uniprot.org/uniprotkb/${encodeURIComponent(ATLAS_ACCESSION)}/entry`;
    link.hidden = !atlasView.values(payload.records, 'accession_source').some(source => /uniprot/i.test(source));
    document.getElementById('atlas-position-count').textContent = window.OglcnacProteinViewer.summarize(payload.records).sites.length.toLocaleString();
    document.getElementById('atlas-record-count').textContent = payload.records.length.toLocaleString();
    document.getElementById('atlas-publication-count').textContent = atlasView.publications(payload.records).length.toLocaleString();
    atlasCompleteRecords = payload.records;
    atlasCompleteFields = atlasView.exportFields(payload.records);
    if (!atlasExportTable) {
      const head = document.querySelector('#detail3 thead tr');
      for (const field of atlasCompleteFields) { const th = document.createElement('th'); th.textContent = field; head.append(th); }
      atlasExportTable = window.OglcnacTables.create('detail3', { filename: `${ATLAS_ACCESSION}-all-fields.csv` });
    }
    atlasExportTable.setRows(payload.records.map(record => atlasCompleteFields.map(field => record[field])));
  }
  const atlasRecordState = document.createElement("p");
  atlasRecordState.setAttribute("data-record-state", "atlas");
  atlasRecordState.setAttribute("role", "status");
  atlasRecordState.setAttribute("aria-live", "polite");
  document.querySelector(".atlas-detail-page .record-subtitle").after(atlasRecordState);

  const atlasRecovery = document.createElement("div");
  atlasRecovery.className = "record-recovery";
  const exampleRecord = document.createElement("a");
  exampleRecord.href = "/atlas/detail/?id=P18583";
  exampleRecord.textContent = "Explore example P18583";
  const retryRecord = document.createElement("button");
  retryRecord.type = "button";
  retryRecord.textContent = "Retry loading record";
  retryRecord.hidden = true;
  retryRecord.addEventListener("click", loadAtlasDetail);
  atlasRecovery.append(exampleRecord, retryRecord);
  atlasRecordState.after(atlasRecovery);
  function showAtlasContent(visible) {
    document.querySelectorAll(".atlas-detail-page .detail-section").forEach(section => { section.hidden = !visible; });
    document.querySelectorAll('.record-section-nav a[href^="#"]').forEach(link => { link.hidden = !visible && link.hash !== '#atlas-overview'; });
    atlasRecovery.hidden = visible;
    document.getElementById("atlas-identity").hidden = !visible;
    document.getElementById("atlas-record-actions").hidden = !visible;
    document.getElementById("atlas-record-metrics").hidden = !visible;
    if (!visible) document.getElementById("atlas-other-names").hidden = true;
  }

  function setAtlasTablesLoading() {
    atlasPeptideTable.setLoading("Loading peptide records…");
    atlasEvidenceTable.setLoading("Loading evidence records…");
    if (atlasExportTable) atlasExportTable.setLoading("Loading complete records…");
  }

  function setAtlasTablesError() {
    atlasPeptideTable.setError("Peptide records could not be loaded.");
    atlasEvidenceTable.setError("Evidence records could not be loaded.");
    if (atlasExportTable) atlasExportTable.setError("Complete records could not be loaded.");
  }

  async function loadAtlasSequence(payload, generation) {
    let fasta = "";
    try {
      fasta = await window.OglcnacStaticData.getAtlasProteinFasta(
        ATLAS_ACCESSION
      );
    } catch (error) {
      fasta = "";
    }
    if (generation !== atlasLoadGeneration) return;
    const sequence = window.OglcnacProteinViewer.sequenceFromFasta(fasta);
    atlasFasta = sequence ? fasta : '';
    if (!sequence) {
      document.getElementById("protein-sequence").textContent =
        "Protein sequence for this entry is not available in the local Atlas snapshot or UniProt. The curated evidence below remains complete.";
      document.getElementById("atlas-length").textContent = "Not available";
    } else {
      document.getElementById("atlas-length").textContent = `${sequence.length.toLocaleString()} aa`;
      document.getElementById("sequence-summary").textContent = `· ${sequence.length.toLocaleString()} residues`;
      document.getElementById("protein-sequence").innerHTML = formatSequence(
        fasta,
        payload.positions || []
      );
    }
    document.getElementById('atlas-download-fasta').disabled = !sequence;
    document.getElementById('atlas-copy-fasta').disabled = !sequence;
    atlasProteinViewer.setSequence(atlasFasta);
    atlasFeatureViewer.setSequence(sequence);
  }

  async function loadAtlasDetail() {
    const generation = ++atlasLoadGeneration;
    showAtlasContent(false);
    atlasProteinViewer?.destroy(); atlasProteinViewer = null;
    atlasEvidenceController?.destroy(); atlasEvidenceController = null;
    atlasFeatureViewer?.destroy(); atlasFeatureViewer = null;
    atlasFasta = '';
    atlasAppliedRows = atlasAppliedBase = null;
    document.getElementById('atlas-download-fasta').disabled = true;
    document.getElementById('atlas-copy-fasta').disabled = true;
    retryRecord.hidden = true;
    if (!ATLAS_ACCESSION) {
      atlasRecordState.dataset.state = "initial";
      atlasRecordState.textContent = "Search for a protein above, or open an example to explore its sequence and curated evidence.";
      return;
    }
    atlasRecordState.dataset.state = "loading";
    atlasRecordState.textContent = "Loading Atlas record…";
    setAtlasTablesLoading();
    let payload;
    try {
      payload = await window.OglcnacStaticData.getAtlasDetail(ATLAS_ACCESSION);
    } catch (error) {
      atlasRecordState.dataset.state = "error";
      atlasRecordState.textContent =
        "This Atlas record could not be loaded. Please try again.";
      document.getElementById("protein-sequence").textContent =
        "Protein sequence is unavailable because the record could not be loaded.";
      retryRecord.hidden = false;
      setAtlasTablesError();
      return;
    }

    if (!payload.records.length) {
      atlasRecordState.dataset.state = "empty";
      atlasRecordState.textContent =
        `No Atlas record was found for ${ATLAS_ACCESSION}.`;
      document.getElementById("protein-sequence").textContent =
        "Atlas record is not available.";
      atlasPeptideTable.setRows([]);
      atlasEvidenceTable.setRows([]);
      if (atlasExportTable) atlasExportTable.setRows([]);
      return;
    }

    showAtlasContent(true);
    populateAtlasIdentity(payload);
    atlasFeatureViewer = window.OglcnacProteinFeatures.create(document.getElementById('atlas-feature-viewer'), { accession: ATLAS_ACCESSION });
    atlasEvidenceController = window.OglcnacAtlasEvidence.create(document.getElementById('atlas-filters'), {
      records: payload.records,
      publicationList: document.getElementById('atlas-publication-list'),
      publicationSummary: document.getElementById('atlas-publication-summary'),
      publicationStatus: document.getElementById('atlas-publication-status'),
      onChange: applyAtlasEvidence, onReset: () => atlasProteinViewer.select(null, false), onDownload: downloadAtlasMatching
    });
    window.OglcnacAtlasEvidence.load(ATLAS_ACCESSION).then(metadata => {
      if (generation !== atlasLoadGeneration) return;
      atlasEvidenceController.setMetadata(metadata); atlasFeatureViewer.setMetadata(metadata.protein);
    }).catch(() => {
      if (generation !== atlasLoadGeneration) return;
      atlasEvidenceController.setMetadata({ publicationsState: 'unavailable' }); atlasFeatureViewer.setMetadata(null);
    });
    atlasProteinViewer = window.OglcnacProteinViewer.create(document.getElementById('atlas-protein-viewer'), {
      accession: ATLAS_ACCESSION, records: payload.records, onSelect: applyAtlasSelection
    });
    atlasProteinViewer.setEvidence(window.OglcnacAtlasEvidence.filter(payload.records, atlasEvidenceController.getFilters()));
    if (window.location.hash === '#atlas-landscape') {
      requestAnimationFrame(() => document.getElementById('atlas-landscape').scrollIntoView({ block: 'start' }));
    }
    atlasRecordState.dataset.state = "ready";
    atlasRecordState.textContent =
      `${payload.records.length.toLocaleString()} curated Atlas records loaded.`;
    document.getElementById("protein-sequence").textContent =
      "Loading protein sequence from the local Atlas snapshot…";
    loadAtlasSequence(payload, generation);
  }

  loadAtlasDetail();
</script>

<script>OglcnacAtlasTools.mountSave(document.getElementById("atlas-detail-save"),()=>ATLAS_ACCESSION?[ATLAS_ACCESSION]:[]);</script>
