




  <script src="/static/js/static-data.js"></script>
  <script src="/static/js/table-utils.js"></script>
  <script>
    function resetAtlasTable() {
      window.OglcnacUi.resetTable("#search_result", "atlas-search-results");
    }

    function startAtlasTable() {
      window.OglcnacUi.startExportTable("#search_result");
    }

    async function runAtlasSearch(event) {
      if (event) {
        event.preventDefault();
      }
      const form = document.getElementById("atlas-search-form");
      const term = form.q.value.trim();
      const field = form.field.value;
      resetAtlasTable();
      if (!term) {
        startAtlasTable();
        return;
      }
      const results = await window.OglcnacStaticData.searchAtlas(term, field);
      const body = document.getElementById("atlas-search-results");
      results.forEach((record) => {
        const row = body.insertRow();
        window.OglcnacUi.linkCell(row, `/atlas/detail/?id=${encodeURIComponent(record.accession)}`, record.accession, true);
        window.OglcnacUi.textCell(row, record.entry_name);
        window.OglcnacUi.textCell(row, record.protein_name);
        window.OglcnacUi.textCell(row, record.gene_name);
        window.OglcnacUi.textCell(row, record.position_in_protein);
        window.OglcnacUi.linkCell(row, `https://www.uniprot.org/uniprot/${encodeURIComponent(record.accession)}`, "UniProt", false);
      });
      startAtlasTable();
      window.history.replaceState({}, "", `${window.location.pathname}?q=${encodeURIComponent(term)}&field=${encodeURIComponent(field)}`);
    }

    $(document).ready(function () {
      startAtlasTable();
      const form = document.getElementById("atlas-search-form");
      form.addEventListener("submit", runAtlasSearch);
      const params = new URLSearchParams(window.location.search);
      if (params.get("q")) {
        document.body.classList.add("has-search-query");
        form.q.value = params.get("q");
        if (params.get("field")) {
          form.field.value = params.get("field");
        }
        runAtlasSearch();
      }
    });
  </script>
