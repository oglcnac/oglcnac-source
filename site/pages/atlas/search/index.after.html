  <script src="/static/js/static-data.js"></script>
  <script src="/static/js/table-utils.js"></script>
  <script>
    const atlasSearchTable = window.OglcnacTables.create("search_result", {
      filename: "oglcnac-atlas-search.csv"
    });

    function atlasSearchRow(record) {
      const accession = record.accession || "";
      return [
        {
          text: accession,
          href: `/atlas/detail/?id=${encodeURIComponent(accession)}`,
          strong: true
        },
        record.entry_name,
        record.protein_name,
        record.gene_name,
        record.position_in_protein,
        {
          text: accession ? "UniProt" : "",
          href: accession
            ? `https://www.uniprot.org/uniprot/${encodeURIComponent(accession)}`
            : "",
          external: true
        }
      ];
    }

    async function runAtlasSearch(event) {
      if (event) {
        event.preventDefault();
      }
      const form = document.getElementById("atlas-search-form");
      const term = form.q.value.trim();
      const field = form.field.value;
      if (!term) {
        atlasSearchTable.setRows([]);
        return;
      }
      atlasSearchTable.setLoading("Loading Atlas records…");
      try {
        const results = await window.OglcnacStaticData.searchAtlas(term, field);
        atlasSearchTable.setRows(results.map(atlasSearchRow), {
          preserveState: false
        });
        window.history.replaceState(
          {},
          "",
          `${window.location.pathname}?q=${encodeURIComponent(term)}&field=${encodeURIComponent(field)}`
        );
      } catch (error) {
        atlasSearchTable.setError(
          "Atlas records could not be loaded. Please try again."
        );
      }
    }

    const atlasSearchForm = document.getElementById("atlas-search-form");
    atlasSearchForm.addEventListener("submit", runAtlasSearch);
    const atlasSearchParams = new URLSearchParams(window.location.search);
    if (atlasSearchParams.get("q")) {
      document.body.classList.add("has-search-query");
      atlasSearchForm.q.value = atlasSearchParams.get("q");
      if (atlasSearchParams.get("field")) {
        atlasSearchForm.field.value = atlasSearchParams.get("field");
      }
      runAtlasSearch();
    }
  </script>
