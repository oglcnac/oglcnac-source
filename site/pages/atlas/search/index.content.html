<section class="search-page-heading">
  <div class="container">
    <p class="eyebrow">O-GlcNAcAtlas 5.0</p>
    <h1>Search <span class="nowrap">O-GlcNAc</span> sites</h1>
    <p class="search-subtitle">
      Search curated O-GlcNAcylated proteins and sites. Current release counts
      and counting rules are available on the <a href="/atlas/statistics/">statistics page</a>.
    </p>
    <form action="/atlas/search/" method="get" class="search-form" id="atlas-search-form">
      <div class="form-field">
        <label for="atlas-search-term">Search term</label>
        <input id="atlas-search-term" type="search" required class="form-control" name="q" autocomplete="off">
      </div>
      <div class="form-field">
        <label for="atlas-search-field">Search field</label>
        <select id="atlas-search-field" class="form-control" name="field">
          <option value="accession">Accession</option>
          <option value="protein_name">Protein name</option>
          <option value="gene_name">Gene name</option>
          <option value="peptide_seq">Peptide sequence</option>
          <option value="species">Species</option>
        </select>
      </div>
      <button type="submit">Search Atlas</button>
    </form>
  </div>
</section>

<section class="table-results-section" aria-labelledby="atlas-results-heading">
  <div class="container">
    <div class="table-card-header">
      <span>Results</span>
      <h2 id="atlas-results-heading">Search results</h2>
    </div>
    <div class="table-scroll" tabindex="0" role="region" aria-label="O-GlcNAcAtlas search results table">
      <table class="table results-table" id="search_result">
        <thead>
          <tr>
            <th>Accession</th>
            <th>Entry Name</th>
            <th>Protein Name</th>
            <th>Gene Name</th>
            <th>Position in Protein</th>
            <th>UniProt Link</th>
          </tr>
        </thead>
        <tbody id="atlas-search-results"></tbody>
      </table>
    </div>
  </div>
</section>
