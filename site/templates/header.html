<header class="site-header">
  <div class="site-header-inner">
    <a class="site-brand" href="/"{{HOME_CURRENT}}>oglcnac.org</a>
    <details class="site-nav-disclosure" open>
      <summary>Menu</summary>
      <div class="site-nav-panel">
        <nav class="site-primary-nav" aria-label="Primary navigation">
          <ul>{{PRIMARY_LINKS}}</ul>
        </nav>
{{SECTION_NAV}}
      </div>
    </details>
  </div>
</header>
<script>
  (function configureResponsiveNavigation() {
    const disclosure = document.querySelector(".site-nav-disclosure");
    const desktop = window.matchMedia("(min-width: 1101px)");
    const sync = (query) => {
      disclosure.open = query.matches;
    };
    sync(desktop);
    if (desktop.addEventListener) {
      desktop.addEventListener("change", sync);
    } else {
      desktop.addListener(sync);
    }
  })();
</script>
